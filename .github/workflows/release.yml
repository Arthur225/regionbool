# Builds installers for every platform, after running all tests on each.
#
# - A pull request that changes packaging runs this as a check, and publishes nothing.
# - Pushing a tag like v1.0.0 also creates a DRAFT release, which a person has to publish.
#
# This repository is private, so these runs use GitHub Actions minutes, and macOS minutes count ten
# times. That's why it doesn't run on every pull request.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - electron-builder.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run check

      # Linux needs a virtual display, and newer Ubuntu blocks the sandbox Electron relies on.
      - name: Prepare Linux to run Electron
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2t64

      - name: Test the app
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:e2e
      - name: Test the packaged app
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:packaged

      - name: Build installers
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
