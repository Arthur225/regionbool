# Packaging settings. See "Releases" in CONTRIBUTING.md.
appId: org.regionbool.app
productName: RegionBool
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  # Read at run time from Electron's resources folder. See bundledFieldsDir in src/main/ipc.ts.
  - from: resources/fields
    to: fields
publish: null
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # Builds aren't signed with a developer certificate yet. "-" is an ad-hoc signature, which Apple
  # Silicon requires for an app to run at all.
  identity: '-'
  # Hardened runtime needs a real certificate, and blocks loading libraries under ad-hoc signing.
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
